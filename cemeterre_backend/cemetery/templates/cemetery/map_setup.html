<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuration des Allées</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; display: flex; flex-direction: column; height: 100vh; }
        #map { flex: 1; width: 100%; }
        .controls { padding: 15px; background: #f8f9fa; border-top: 1px solid #ddd; text-align: center; }
        .btn { padding: 10px 20px; background: #496042; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .btn:hover { background: #3a4d35; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        #status { margin-top: 10px; font-size: 14px; color: #555; }
        .summary { margin-top: 8px; font-size: 13px; color: #333; }
        .legend { display: flex; justify-content: center; gap: 20px; margin-top: 8px; font-size: 13px; }
        .legend span { display: inline-flex; align-items: center; gap: 6px; }
        .swatch { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="controls">
        <button id="finalizeBtn" class="btn" onclick="finalizeConfiguration()">💾 Finaliser et générer les sections</button>
        <div id="status">Dessinez vos allées avec l'outil ligne (polyline) à gauche, puis cliquez sur Finaliser. Les sections sont calculées automatiquement à partir des allées.</div>
        <div id="summary" class="summary"></div>
        <div class="legend">
            <span><span class="swatch" style="background:#C62828"></span> Allée (à dessiner)</span>
            <span><span class="swatch" style="background:#2E7D9A"></span> Section (générée automatiquement)</span>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const lat = parseFloat(params.get('lat'));
        const lng = parseFloat(params.get('lng'));
        const longueur = parseFloat(params.get('longueur'));
        const largeur = parseFloat(params.get('largeur'));
        const graveLength = parseFloat(params.get('grave_length'));
        const graveWidth = parseFloat(params.get('grave_width'));
        const espacement = parseFloat(params.get('espacement'));
        const token = params.get('token');

        const name = params.get('name');
        const city = params.get('city');
        const address = params.get('address');
        const totalArea = parseFloat(params.get('total_area'));

        const map = L.map('map').setView([lat, lng], 16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        const dLat = (largeur / 2) / 111000;
        const dLng = (longueur / 2) / (111000 * Math.cos(lat * Math.PI / 180));
        const bounds = [[lat - dLat, lng - dLng], [lat + dLat, lng + dLng]];
        L.rectangle(bounds, { color: "#496042", weight: 2, fillOpacity: 0.05, dashArray: "6,4" }).addTo(map);
        map.fitBounds(bounds);

        // Groupe pour les allées dessinées par l'utilisateur (modifiable)
        const drawnItems = new L.FeatureGroup();
        map.addLayer(drawnItems);

        // Groupe pour les sections générées automatiquement (lecture seule, ajouté après finalisation)
        const sectionsLayer = new L.FeatureGroup();
        map.addLayer(sectionsLayer);

        // Uniquement l'outil ligne : les sections ne se dessinent pas, elles sont calculées côté serveur
        const drawControl = new L.Control.Draw({
            draw: {
                polygon: false,
                circle: false,
                circlemarker: false,
                marker: false,
                rectangle: false,
                polyline: { shapeOptions: { color: '#C62828', weight: 5 } }
            },
            edit: { featureGroup: drawnItems }
        });
        map.addControl(drawControl);

        map.on(L.Draw.Event.CREATED, function (e) {
            drawnItems.addLayer(e.layer);
        });

        async function finalizeConfiguration() {
            const btn = document.getElementById('finalizeBtn');
            const status = document.getElementById('status');
            const summary = document.getElementById('summary');

            const alleesLayers = drawnItems.toGeoJSON().features;
            if (alleesLayers.length === 0) {
                status.innerText = "⚠️ Veuillez dessiner au moins une allée avant de finaliser.";
                status.style.color = "red";
                return;
            }

            btn.disabled = true;
            status.innerText = "⏳ Enregistrement en cours et calcul des sections...";
            summary.innerText = "";

            const allees = alleesLayers.map((layer, i) => ({
                nom: "Allée " + (i + 1),
                type_allee: "secondaire",
                largeur: 3.0,
                coordinates: layer.geometry.coordinates.map(c => [c[1], c[0]]) // [lng,lat] -> [lat,lng]
            }));

            const payload = {
                cemetery: {
                    name: name,
                    city: city,
                    address: address,
                    latitude: lat,
                    longitude: lng,
                    total_area: totalArea,
                    longueur_totale: longueur,
                    largeur_totale: largeur,
                    grave_length: graveLength,
                    grave_width: graveWidth,
                    espacement_caveaux: espacement,
                    non_exploitable_area: 0.0
                },
                allees: allees
            };

            try {
                const response = await fetch('http://127.0.0.1:8000/api/cemetery/cemeteries/initialize-complete/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (!response.ok) {
                    status.innerText = "❌ Erreur: " + (data.detail || data.message || "Inconnue");
                    status.style.color = "red";
                    btn.disabled = false;
                    return;
                }

                // Le endpoint renvoie cemetery_id, sections (avec surface/capacité) et allees
                status.innerText = "✅ Configuration réussie !";
                status.style.color = "green";
                summary.innerText = `${data.sections_creees ?? (data.sections || []).length} section(s) générée(s) · ` +
                    `capacité totale : ${data.capacite_totale ?? cemetery_calculated_capacity_fallback(data)} caveaux`;

                // Affiche les sections générées automatiquement sur la carte (confirmation visuelle)
                await displayGeneratedSections();

                setTimeout(() => {
                    window.location.href = "http://127.0.0.1:8550/dashboard/admin";
                }, 2500);

            } catch (error) {
                status.innerText = "❌ Erreur réseau: " + error.message;
                status.style.color = "red";
                btn.disabled = false;
            }
        }

        function cemetery_calculated_capacity_fallback(data) {
            return (data.sections || []).reduce((sum, s) => sum + (s.capacite || 0), 0);
        }

        async function displayGeneratedSections() {
            try {
                const resp = await fetch('http://127.0.0.1:8000/api/cemetery/sections/geojson/', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!resp.ok) return;
                const geojson = await resp.json();

                sectionsLayer.clearLayers();
                L.geoJSON(geojson, {
                    style: { color: '#2E7D9A', weight: 2, fillOpacity: 0.25 },
                    onEachFeature: (feature, layer) => {
                        const p = feature.properties;
                        layer.bindPopup(`<b>${p.nom}</b><br>Surface: ${Math.round(p.surface)} m²<br>Capacité: ${p.capacite} caveaux`);
                    }
                }).addTo(sectionsLayer);
            } catch (e) {
                console.warn("Impossible d'afficher les sections générées:", e);
            }
        }
    </script>
</body>
</html>
